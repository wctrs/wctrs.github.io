<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WCTRS publication status</title>
<style>
:root{--bg:#F5F7F8;--ink:#14232B;--muted:#55666F;--accent:#0A6C74;--line:#D6DEE2}
@media (prefers-color-scheme: dark){:root{--bg:#0F181C;--ink:#E6EEF1;--muted:#9DB0B9;--accent:#5CC4CB;--line:#2B3B43;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:40rem;margin:0 auto;padding:3rem max(16px,env(safe-area-inset-right,0px)) 3rem max(16px,env(safe-area-inset-left,0px))}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 .5rem}p{color:var(--muted);margin:0 0 1.5rem}
a.card{display:block;padding:1rem 1.1rem;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
a.card strong{color:var(--accent)}a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>WCTRS publication status</h1>
<p>Status pages for conference publications of the World Conference on Transport Research Society.</p>
<a class="card" href="wctr2026/procedia/"><strong>WCTR 2026 Toulouse</strong><br>Transportation Research Procedia: check the status of your paper</a>
</main>
</body>
</html>
